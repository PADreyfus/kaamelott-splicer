<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodo avec Kaamelott</title>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <header>
    <h1>🌙 Dodo avec Kaamelott</h1>
    <p class="tagline">L'application prévue à cet effet <span id="appVersion" class="version"></span></p>
  </header>

  <main>
    <!-- Upload -->
    <section id="uploadArea" class="card upload">
      <div class="upload-icon">🎺</div>
      <h2>Charger une compilation</h2>
      <p>Les épisodes sont détectés grâce au jingle des trois cors qui ouvre chaque épisode.</p>
      <button id="bLoad" class="btn primary">Choisir un fichier MP3</button>
      <input type="file" id="fileInput" accept="audio/*" multiple hidden>
    </section>

    <!-- Loading -->
    <section id="loadArea" class="card" style="display:none">
      <h2 id="loadTitle">Analyse…</h2>
      <p id="loadSub" class="muted"></p>
      <div class="progress"><div id="loadFill" class="progress-fill"></div></div>
    </section>

    <!-- Player -->
    <section id="playerArea" style="display:none">
      <div id="npCard" class="card now-playing" style="display:none">
        <div class="np-labels">
          <div id="npTitle" class="np-title"></div>
          <div id="npSub" class="muted"></div>
        </div>
        <div id="seekBar" class="progress seekable"><div id="pFill" class="progress-fill"></div><div id="pKnob" class="progress-knob"></div></div>
        <div class="np-times"><span id="tElapsed">0:00</span><span id="tTotal">0:00</span></div>
      </div>

      <div class="controls">
        <button id="bPlay" class="btn round big">▶</button>
        <button id="bNext" class="btn round" title="Épisode suivant">⏭</button>
        <button id="bShuffle" class="btn round" title="Mélanger les épisodes">🔀</button>
      </div>
      <div class="controls">
        <button id="bAuto" class="btn toggle" title="Enchaîner automatiquement">Auto</button>
        <button id="bSkipIntro" class="btn toggle" title="Passer le jingle des cors">🎺 Passer l'intro</button>
        <button id="bSleep" class="btn toggle" title="Pause automatique après 30 minutes">⏾ 30 min</button>
        <button id="bMore" class="btn" title="Ajouter une compilation">＋</button>
      </div>

      <div class="card">
        <h2 id="epCount"></h2>
        <div id="epList"></div>
      </div>
    </section>
  </main>

  <script src="app.js?v=13"></script>
</body>
</html>
